name: fireops

services:
  postgres:
    image: postgres:16-alpine
    container_name: fireops-postgres
    environment:
      POSTGRES_DB: fireguard
      POSTGRES_USER: fireguard
      POSTGRES_PASSWORD: fireguard-demo
    ports:
      - "54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireguard -d fireguard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - fireops_pgdata:/var/lib/postgresql/data

volumes:
  fireops_pgdata:

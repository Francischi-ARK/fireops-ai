services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fireguard
      POSTGRES_USER: fireguard
      POSTGRES_PASSWORD: fireguard-demo
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireguard -d fireguard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - fireguard_pgdata:/var/lib/postgresql/data

volumes:
  fireguard_pgdata:
